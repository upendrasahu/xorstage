app:
  baseUrl: ${APP_BASE_URL:-http://localhost:7007}

backend:
  # Enable backend authentication
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  baseUrl: ${BACKEND_BASE_URL:-http://localhost:7007}
  listen: ':7007'
  # Listen on all interfaces
  host: 0.0.0.0
  # CORS configuration
  cors:
    origin: "*"
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # Use SQLite in-memory database instead of PostgreSQL
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  # Enable authentication
  environment: development
  session:
    secret: ${SESSION_SECRET}
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # Configure guest auth to work properly
    guest:
      enabled: true

    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        callbackUrl: ${AUTH_GITHUB_CALLBACK_URL}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

# Configure techdocs to minimize errors
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'
  search:
    indexing:
      enabled: false
  requestUrl: ${BACKSTAGE_HOST_URL}

# Simplified catalog configuration
catalog:
  import:
    entityFilename: catalog-info.yaml
  # Fix file paths to be relative to the container's working directory
  locations:
    # Local example data
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
        
# Disable permissions to avoid auth issues
permission:
  enabled: false
